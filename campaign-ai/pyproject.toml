[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "campaign-ai"
version = "0.1.0"
description = "Campaign brief extraction with mandatory human review"
requires-python = ">=3.12,<3.13"

dependencies = [
    "langgraph>=1,<2",
    "litellm>=1,<2",
    "instructor>=1,<2",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "streamlit>=1.40,<2",
    "httpx[socks]>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

postgres = [
    "langgraph-checkpoint-postgres>=3,<4",
    "psycopg[binary,pool]>=3,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]