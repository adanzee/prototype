
name: Python Checks

on:
  push:
    branches: [main]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check Python syntax
        run: |
          find . -type f -name "*.py" \
            -not -path "./.git/*" \
            -not -path "./.venv/*" \
            -print0 | xargs -0 -r python -m py_compile
